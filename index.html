<body class="min-h-screen flex flex-col items-center justify-center p-4" oncontextmenu="return false;">

    <!-- KARTU ANTARMUKA UTAMA -->
    <div class="w-full max-w-md glass rounded-[3.5rem] overflow-hidden relative shadow-[0_30px_60px_-15px_rgba(0,0,0,0.9)] flex flex-col border border-white/10">
        
        <!-- AREA VIDEO -->
        <div id="videoArea" class="relative w-full h-[60vh] max-h-[520px] bg-black overflow-hidden flex items-center justify-center">
            
            <!-- PEMUTAR VIDEO ASLI (Kontrol bawaan) -->
            <video id="mainPlayer" controls playsinline preload="metadata">
                Your browser does not support the video tag.
            </video>

            <!-- PESAN ERROR (Jika ID kosong/salah) -->
            <div id="errorMsg" class="hidden absolute text-gray-500 text-xs font-bold tracking-[0.2em] uppercase">
                Video Unavailable
            </div>

        </div>

        <!-- PANEL IKLAN & LEGAL -->
        <div id="actionBox" class="p-8 bg-[#070709] flex flex-col items-center border-t border-white/5">
            
            <!-- LABEL TRENDING X VIDEO (Sekarang bisa diklik) -->
            <a href="https://www.facebook.com/groups/1646509056316964" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 mb-6 px-5 py-2 bg-red-600/10 rounded-full border border-red-500/20 shadow-[0_0_15px_rgba(220,38,38,0.1)] hover:bg-red-600/20 transition-colors cursor-pointer text-decoration-none">
                <i data-lucide="flame" class="w-4 h-4 text-red-500 fill-red-500/20"></i>
                <span class="text-xs font-black tracking-[0.15em] text-red-400 uppercase">Trending X Video</span>
            </a>

            <div class="ad-slot mb-4">
                <!-- IKLAN BANNER ADSTERRA -->
                <script type="text/javascript">
                    atOptions = {
                        'key' : '40f6d8e53b94841ddceb2cbf7ae47723',
                        'format' : 'iframe',
                        'height' : 50,
                        'width' : 320,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="https://awkwardmonopoly.com/40f6d8e53b94841ddceb2cbf7ae47723/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Ambil ID dari URL
        let videoId = window.location.pathname.split('/').pop().trim();
        if (videoId === "index.html" || videoId === "" || videoId === "bridge.html") videoId = "";

        const mainPlayer = document.getElementById("mainPlayer");
        const errorMsg = document.getElementById("errorMsg");

        if(/^[a-zA-Z0-9_.-]{3,80}$/.test(videoId) && videoId !== ""){
            let filename = videoId.includes('.') ? videoId : videoId + ".mp4";
            let videoUrl = "https://cdn.videy.co/" + encodeURIComponent(filename);
            
            // Masukkan URL ke dalam player
            mainPlayer.src = videoUrl;
            
            // Jika video gagal diload (dihapus/tidak valid)
            mainPlayer.addEventListener("error", () => {
                mainPlayer.classList.add("hidden");
                errorMsg.classList.remove("hidden");
            });
        } else {
            // Jika dibuka tanpa ID video di URL
            mainPlayer.classList.add("hidden");
            errorMsg.classList.remove("hidden");
            errorMsg.innerText = "NO VIDEO ID PROVIDED";
        }
    </script>
