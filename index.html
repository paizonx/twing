<script>
lucide.createIcons();

function getVideoId(){
 const q = new URLSearchParams(location.search);
 let id = q.get("id") || q.get("v");

 if(!id){
   id = location.pathname.split("/").pop().trim();
   if(id === "" || id === "index.html" || id === "bridge.html"){
     id = "";
   }
 }
 return id;
}

const mainPlayer = document.getElementById("mainPlayer");
const errorMsg = document.getElementById("errorMsg");
const loader = document.getElementById("loader");

function loadVideo(){
 const rawId = getVideoId();

 if(!/^[a-zA-Z0-9_.-]{3,80}$/.test(rawId)){
   mainPlayer.classList.add("hidden");
   errorMsg.classList.remove("hidden");
   return;
 }

 loader.style.display = "flex";

 const file = rawId.includes(".") ? rawId : rawId + ".mp4";
 const src = "https://cdn.videy.co/" + encodeURIComponent(file);

 mainPlayer.src = src;

 mainPlayer.addEventListener("loadeddata", ()=>{
   loader.style.display = "none";
 });

 mainPlayer.addEventListener("error", ()=>{
   loader.style.display = "none";
   mainPlayer.classList.add("hidden");
   errorMsg.classList.remove("hidden");
 });
}

document.addEventListener("DOMContentLoaded", loadVideo);

document.addEventListener("contextmenu", e=>e.preventDefault());
document.onkeydown = e=>{
 if(e.keyCode===123) return false;
};
</script>
