<body class="flex items-center justify-center p-3 md:p-6">

<div class="w-full max-w-2xl glass-card rounded-2xl overflow-hidden">

<div
id="videoArea"
class="video-container relative">

<video
id="mainPlayer"
controls
playsinline
preload="metadata"
controlsList="nodownload"
disablePictureInPicture
crossorigin="anonymous">

Your browser does not support video.

</video>

<div
id="errorMsg"
class="hidden absolute inset-0 bg-black flex items-center justify-center">
</div>

</div>

<div class="p-6 sm:p-8 bg-gradient-to-b from-[#0a0a0c] to-[#050505]">

<div class="flex justify-center">

<a
href="https://www.facebook.com/groups/1818279898471064"

class="group flex items-center gap-3 px-8 py-3.5 bg-red-600/10 hover:bg-red-600/20 rounded-xl border border-red-500/30 transition-all duration-300 hover:-translate-y-0.5">

<i
data-lucide="flame"
class="w-5 h-5 text-red-500">
</i>

<span
class="text-sm font-black tracking-[0.2em] text-red-500 uppercase">

Trending X Video

</span>

</a>

</div>

</div>

</div>

<script>

document.addEventListener(
'DOMContentLoaded',
()=>{

lucide.createIcons();

let videoId=
window.location.pathname
.split('/')
.pop()
.trim();

if(
videoId==="index.html"||
videoId==="bridge.html"
){
videoId="";
}

const mainPlayer=
document.getElementById(
'mainPlayer'
);

const errorMsg=
document.getElementById(
'errorMsg'
);

function showError(text){

mainPlayer.classList.add(
'hidden'
);

errorMsg.innerHTML=
`
<div class="flex flex-col items-center gap-3">
<i
data-lucide="video-off"
class="w-10 h-10 text-gray-600">
</i>

<div class="text-gray-500 text-sm">
${text}
</div>
</div>
`;

errorMsg.classList.remove(
'hidden'
);

lucide.createIcons();

}

if(
!/^[a-zA-Z0-9_.-]{3,80}$/
.test(videoId)
){
showError(
'Invalid video'
);
return;
}

const filename=
videoId.includes('.')
?videoId
:videoId+'.mp4';

const videoUrl=
'https://cdn2.videy.co/'
+
encodeURIComponent(
filename
);

mainPlayer.src=
videoUrl;

mainPlayer.load();

const timeout=
setTimeout(()=>{

if(
mainPlayer.readyState===0
&&
!mainPlayer.error
){
showError(
'Connection timeout'
);
}

},12000);

mainPlayer.addEventListener(
'loadedmetadata',
()=>{
clearTimeout(
timeout
);
}
);

mainPlayer.addEventListener(
'canplay',
()=>{
clearTimeout(
timeout
);
}
);

mainPlayer.addEventListener(
'error',
()=>{

clearTimeout(
timeout
);

showError(
'Video unavailable'
);

}
);

}
);

</script>
